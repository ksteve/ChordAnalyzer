<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<title>Chord Analyzer 🎹</title>
<style>
  body {
    background: #121212;
    color: #eee;
    font-family: "Segoe UI", sans-serif;
    text-align: center;
    padding: 20px;
    overflow-x: hidden;
  }
  h1 { color: #ffcc00; margin-bottom: 6px; }
  .subtitle { color: #aaa; margin-bottom: 18px; font-size: 0.95em; }

  #notes, #chord, #roman, #scaleNotes {
    margin-top: 8px;
    font-weight: bold;
    font-size: 1.15em;
    transition: color 0.2s;
  }
  #scaleNotes { color: #8ab4f8; font-weight: 500; font-size: 1em; }

  select {
    font-size: 1em;
    margin: 8px 0;
    padding: 5px 10px;
    background: #222;
    color: #eee;
    border: 1px solid #555;
    border-radius: 5px;
  }

  .piano {
    position: relative;
    display: flex;
    justify-content: center;
    margin: 36px auto;
    width: fit-content;
    max-width: 100%;
    user-select: none;
    -webkit-user-select: none;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 8px;
    touch-action: pan-x;
    scroll-behavior: smooth;
  }
  .white {
    width: 50px;
    height: 200px;
    border: 1px solid #555;
    background: #eee;
    margin: 0 1px;
    border-radius: 5px 5px 0 0;
    position: relative;
    z-index: 1;
    transition: background 0.15s;
    box-shadow: 0 4px 6px rgba(0,0,0,0.4);
    flex-shrink: 0;
  }
  .white.active { background: #ffcc00; }
  .white.in-scale { background: #e8f0fe; }
  .white.active.in-scale { background: #ffcc00; }

  .black {
    width: 32px;
    height: 120px;
    background: #333;
    position: absolute;
    left: 35px;
    top: 0;
    z-index: 2;
    border-radius: 3px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.6);
    transition: background 0.15s;
  }
  .black.active { background: #ffcc00; }
  .black.in-scale { background: #555; }
  .black.active.in-scale { background: #ffcc00; }

  /* Mobile: slightly narrower keys so more of the keyboard is visible */
  @media (max-width: 700px) {
    body { padding: 12px 8px; }
    .white {
      width: 36px;
      height: 160px;
    }
    .black {
      width: 24px;
      height: 100px;
      left: 24px;
    }
    #notes, #chord, #roman, #scaleNotes {
      font-size: 1.05em;
    }
  }

  @keyframes pulse {
    0% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.08); opacity: 0.85; }
    100% { transform: scale(1); opacity: 1; }
  }
  #chord.pulse { animation: pulse 0.3s ease; }

  #history h3 {
    margin-top: 18px;
    color: #ffcc00;
    font-size: 1em;
  }
  #historyList {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    margin: 6px auto;
    max-width: 560px;
  }
  #historyList span {
    background: #1e1e1e;
    padding: 6px 10px;
    border-radius: 6px;
    color: #ffcc00;
    font-weight: 600;
  }

  .tip {
    color: #777;
    font-size: 0.85em;
    margin-top: 12px;
  }
</style>
</head>
<body>
<h1>Chord Analyzer 🎹</h1>
<p class="subtitle">Learn chords, scales, and how notes fit together</p>

<label for="keySelect">Key / Scale: </label>
<select id="keySelect">
  <option>C major</option><option>G major</option><option>D major</option>
  <option>A major</option><option>E major</option><option>B major</option>
  <option>F major</option><option>C minor</option><option>G minor</option>
  <option>D minor</option><option>A minor</option><option>E minor</option>
  <option>B minor</option><option>F minor</option>
</select>

<div id="scaleNotes">Scale: –</div>
<div id="notes">Notes: </div>
<div id="chord">Chord: </div>
<div id="roman">Roman numeral: </div>

<div id="history" aria-live="polite">
  <h3>Last 5 chords</h3>
  <div id="historyList"></div>
</div>

<div class="piano" id="piano"></div>

<p class="tip">MIDI · Computer keys (A W S E D F T G Y H U J K) · Touch / click</p>

<script src="https://cdn.jsdelivr.net/npm/tonal/browser/tonal.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.39/Tone.js"></script>
<script>
(function () {
  if (typeof Tonal === "undefined" || typeof Tone === "undefined") {
    console.error("Tonal or Tone failed to load");
    document.getElementById("scaleNotes").textContent = "Libraries failed to load – check network";
    return;
  }

  const { Note, Chord, Key, Scale } = Tonal;
  const activeNotes = new Set();

  // Resume audio context on first user gesture (required by browsers)
  let audioReady = false;
  async function ensureAudio() {
    if (audioReady) return;
    try {
      await Tone.start();
      audioReady = true;
    } catch (e) {
      console.warn("Audio start failed", e);
    }
  }

  const pianoSampler = new Tone.Sampler({
    urls: {
      "A0":"A0.mp3","C1":"C1.mp3","D#1":"Ds1.mp3","F#1":"Fs1.mp3",
      "A1":"A1.mp3","C2":"C2.mp3","D#2":"Ds2.mp3","F#2":"Fs2.mp3",
      "A2":"A2.mp3","C3":"C3.mp3","D#3":"Ds3.mp3","F#3":"Fs3.mp3",
      "A3":"A3.mp3","C4":"C4.mp3","D#4":"Ds4.mp3","F#4":"Fs4.mp3",
      "A4":"A4.mp3","C5":"C5.mp3","D#5":"Ds5.mp3","F#5":"Fs5.mp3",
      "A5":"A5.mp3","C6":"C6.mp3","D#6":"Ds6.mp3","F#6":"Fs6.mp3",
      "A6":"A6.mp3","C7":"C7.mp3","D#7":"Ds7.mp3","F#7":"Fs7.mp3",
      "A7":"A7.mp3","C8":"C8.mp3"
    },
    release: 2,
    baseUrl: "https://tonejs.github.io/audio/salamander/"
  }).toDestination();

  const keyMap = { a:60, w:61, s:62, e:63, d:64, f:65, t:66, g:67, y:68, h:69, u:70, j:71, k:72 };

  // Piano UI
  const startNote = 48, numKeys = 48;
  const piano = document.getElementById("piano");
  const keyElements = {};
  const whiteOrder = [0, 2, 4, 5, 7, 9, 11];

  for (let i = 0; i < numKeys; i++) {
    const midi = startNote + i;
    const pc = midi % 12;
    if (whiteOrder.includes(pc)) {
      const w = document.createElement("div");
      w.className = "white";
      w.dataset.midi = midi;
      piano.appendChild(w);
      keyElements[midi] = w;
    } else {
      const bw = document.createElement("div");
      bw.className = "black";
      bw.dataset.midi = midi;
      if (piano.lastElementChild) {
        piano.lastElementChild.appendChild(bw);
      }
      keyElements[midi] = bw;
    }
  }

  // Center the piano on load so middle C area is visible on mobile
  function centerPiano() {
    // Scroll so roughly the middle of the keyboard is in view
    const target = piano.scrollWidth / 2 - piano.clientWidth / 2;
    piano.scrollLeft = Math.max(0, target);
  }
  // Run after layout
  requestAnimationFrame(() => {
    centerPiano();
    // Also after a short delay in case fonts/images affect width
    setTimeout(centerPiano, 100);
  });
  window.addEventListener("resize", centerPiano);

  function playNote(midi) {
    ensureAudio().then(() => {
      try { pianoSampler.triggerAttack(Note.fromMidi(midi)); } catch (e) {}
    });
  }
  function stopNote(midi) {
    try { pianoSampler.triggerRelease(Note.fromMidi(midi)); } catch (e) {}
  }
  function activateKey(midi) {
    if (keyElements[midi]) keyElements[midi].classList.add("active");
    playNote(midi);
  }
  function deactivateKey(midi) {
    if (keyElements[midi]) keyElements[midi].classList.remove("active");
    stopNote(midi);
  }

  function highlightScale() {
    try {
      const keyName = document.getElementById("keySelect").value;
      const scale = Scale.get(keyName);
      if (!scale || !scale.notes) {
        document.getElementById("scaleNotes").textContent = "Scale: –";
        return;
      }
      document.getElementById("scaleNotes").textContent = "Scale: " + scale.notes.join("  ");

      const scalePcs = scale.notes.map(n => Note.pitchClass(n));
      Object.values(keyElements).forEach(el => {
        const midi = +el.dataset.midi;
        const noteName = Note.fromMidi(midi);
        const pc = Note.pitchClass(noteName);
        if (scalePcs.includes(pc)) el.classList.add("in-scale");
        else el.classList.remove("in-scale");
      });
    } catch (err) {
      console.warn("Scale highlight error", err);
      document.getElementById("scaleNotes").textContent = "Scale: –";
    }
  }

  function detectChord(notes) {
    if (notes.length === 0) return { name: "", roman: "", color: "#eee" };

    const pitchClasses = notes.map(n => Note.pitchClass(n));
    const detected = Chord.detect(pitchClasses);
    if (!detected || detected.length === 0) return { name: "", roman: "", color: "tomato" };

    const chordName = detected[0];
    const keyName = document.getElementById("keySelect").value;
    const [tonic, type] = keyName.split(" ");
    const scaleNotes = (Scale.get(keyName).notes) || [];

    const chordNotes = (Chord.get(chordName).notes || []).map(Note.pitchClass);
    const inKey = chordNotes.every(n => scaleNotes.includes(n));

    let roman = "";
    if (inKey) {
      try {
        const keyData = type === "major" ? Key.majorKey(tonic) : Key.minorKey(tonic);
        const harmonized = type === "major" ? keyData.chords : (keyData.natural && keyData.natural.chords);
        if (harmonized) {
          const rootPc = chordNotes[0];
          const idx = harmonized.findIndex(c => {
            const cn = Chord.get(c).notes || [];
            return cn.length && Note.pitchClass(cn[0]) === rootPc;
          });
          if (idx >= 0) {
            roman = type === "major"
              ? keyData.scaleDegrees[idx]
              : (keyData.natural && keyData.natural.scaleDegrees[idx]);
          }
        }
      } catch (e) { roman = ""; }
    }

    return { name: chordName, roman, color: inKey ? "limegreen" : "tomato" };
  }

  let lastChord = "";
  const chordHistory = [];
  const maxHistory = 5;
  let stableTimer = null;
  let stableCandidate = "";

  function pushHistory(entry) {
    if (!entry || !entry.trim()) return;
    chordHistory.push({ name: entry });
    if (chordHistory.length > maxHistory) chordHistory.shift();
    renderHistory();
  }

  function renderHistory() {
    const container = document.getElementById("historyList");
    if (!container) return;
    container.innerHTML = "";
    chordHistory.forEach(item => {
      const span = document.createElement("span");
      span.textContent = item.name;
      container.appendChild(span);
    });
  }

  function updateDisplay() {
    const notes = Array.from(activeNotes).sort((a, b) => a - b).map(Note.fromMidi);
    document.getElementById("notes").textContent = "Notes: " + (notes.length ? notes.join(" ") : "–");

    const result = detectChord(notes);
    const chordDiv = document.getElementById("chord");
    chordDiv.textContent = "Chord: " + (result.name || "–");
    chordDiv.style.color = result.color;

    if (result.name !== lastChord) {
      chordDiv.classList.remove("pulse");
      void chordDiv.offsetWidth;
      chordDiv.classList.add("pulse");
      if (stableTimer) { clearTimeout(stableTimer); stableTimer = null; stableCandidate = ""; }

      if (result.name) {
        stableCandidate = result.name;
        stableTimer = setTimeout(() => {
          if (lastChord === stableCandidate) pushHistory(stableCandidate);
          stableTimer = null;
          stableCandidate = "";
        }, 500);
      }
      lastChord = result.name;
    }

    document.getElementById("roman").textContent = result.roman
      ? "Roman numeral: " + result.roman
      : "Roman numeral: –";
  }

  document.getElementById("keySelect").addEventListener("change", () => {
    highlightScale();
    updateDisplay();
  });
  highlightScale();

  // MIDI
  if (navigator.requestMIDIAccess) {
    navigator.requestMIDIAccess().then(ma => {
      for (let input of ma.inputs.values()) {
        input.onmidimessage = msg => {
          const [cmd, note, vel] = msg.data;
          if (cmd === 144 && vel > 0) { activeNotes.add(note); activateKey(note); }
          else if (cmd === 128 || (cmd === 144 && vel === 0)) { activeNotes.delete(note); deactivateKey(note); }
          updateDisplay();
        };
      }
    }).catch(() => {});
  }

  // Computer keyboard
  window.addEventListener("keydown", e => {
    if (e.repeat) return;
    const note = keyMap[e.key.toLowerCase()];
    if (note && !activeNotes.has(note)) {
      activeNotes.add(note);
      activateKey(note);
      updateDisplay();
    }
  });
  window.addEventListener("keyup", e => {
    const note = keyMap[e.key.toLowerCase()];
    if (note) {
      activeNotes.delete(note);
      deactivateKey(note);
      updateDisplay();
    }
  });

  // More robust pointer handling (prevents stuck keys)
  const activePointers = new Map(); // pointerId -> midi

  function pointerDown(e) {
    const el = e.target.closest("[data-midi]");
    if (!el) return;
    const midi = +el.dataset.midi;
    e.preventDefault();
    try { el.setPointerCapture(e.pointerId); } catch (_) {}
    activePointers.set(e.pointerId, midi);
    if (!activeNotes.has(midi)) {
      activeNotes.add(midi);
      activateKey(midi);
      updateDisplay();
    }
  }

  function pointerUp(e) {
    const midi = activePointers.get(e.pointerId);
    if (midi === undefined) return;
    activePointers.delete(e.pointerId);
    try { e.target.releasePointerCapture?.(e.pointerId); } catch (_) {}
    activeNotes.delete(midi);
    deactivateKey(midi);
    updateDisplay();
  }

  piano.addEventListener("pointerdown", pointerDown);
  piano.addEventListener("pointerup", pointerUp);
  piano.addEventListener("pointercancel", pointerUp);
  // Also clear on leave of the whole piano (safety net)
  piano.addEventListener("pointerleave", e => {
    if (e.target === piano) {
      activePointers.forEach((midi) => {
        activeNotes.delete(midi);
        deactivateKey(midi);
      });
      activePointers.clear();
      updateDisplay();
    }
  });
})();
</script>
</body>
</html>
